services:
  dockerupbot:
    image: ghcr.io/godwintgn/dockerupbot:latest
    container_name: dockerupbot
    restart: unless-stopped
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${COMPOSE_ROOT}:${COMPOSE_ROOT}:ro
      - ./data/bot:/data
    networks:
      - du-tunnel
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9467/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  diun:
    image: crazymax/diun:latest
    container_name: diun
    command: serve
    restart: unless-stopped
    volumes:
      - ./data/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ:-Asia/Muscat}
      - DIUN_WATCH_WORKERS=20
      - DIUN_WATCH_SCHEDULE=0 */6 * * *
      - DIUN_WATCH_FIRSTCHECKNOTIF=false
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_NOTIF_WEBHOOK_ENDPOINT=http://dockerupbot:9467/webhook/diun
      - DIUN_NOTIF_WEBHOOK_METHOD=POST
      - DIUN_NOTIF_WEBHOOK_HEADERS_CONTENT-TYPE=application/json
      - DIUN_NOTIF_WEBHOOK_HEADERS_AUTHORIZATION=${WEBHOOK_SECRET}
      - DIUN_NOTIF_WEBHOOK_TIMEOUT=10s
    networks:
      - du-tunnel
    mem_limit: 256m

networks:
  du-tunnel:
    name: du-tunnel
